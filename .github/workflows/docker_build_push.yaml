name: Build, Push & Deploy to GKE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/*" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  REPOSITORY: expense-repo
  IMAGE_NAME: expense-tracker-web
  GKE_CLUSTER: devops-gke-cluster

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $IMAGE_URI ./app
          docker push $IMAGE_URI

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      - name: Deploy Manifests to GKE
        run: |
          # Substitute PROJECT_ID_PLACEHOLDER with real project ID
          sed -i "s/PROJECT_ID_PLACEHOLDER/${{ env.PROJECT_ID }}/g" k8s/deployment.yaml
          
          # Apply Kubernetes configurations
          kubectl apply -f k8s/
          
          # Trigger rolling update with newly pushed image tag
          kubectl set image deployment/expense-tracker-deployment \
            expense-tracker=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Wait for rollout completion
          kubectl rollout status deployment/expense-tracker-deployment

      - name: Fetch and Print Application URL
        run: |
          echo "=================================================="
          echo "Waiting for LoadBalancer External IP..."
          
          # Loop until External IP is provisioned by GCP LoadBalancer
          EXTERNAL_IP=""
          while [ -z "$EXTERNAL_IP" ]; do
            EXTERNAL_IP=$(kubectl get svc expense-tracker-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -z "$EXTERNAL_IP" ]; then
              echo "IP pending... retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          echo "=================================================="
          echo "SUCCESS: Streamlit App is live!"
          echo "Application URL: http://${EXTERNAL_IP}"
          echo "=================================================="
